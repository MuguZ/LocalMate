<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101311"><meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css">
  <title>LocalMate</title>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><div class="mark">L</div><div><h1>LocalMate</h1><p>YOUR PRIVATE ASSISTANT</p></div></div><span class="local"><i></i> LOCAL</span></header>
    <section class="welcome" id="welcome"><div class="eyebrow">A QUIETER KIND OF AI</div><h2>What can I help<br>you with?</h2><p>Your messages stay on this device and your local Ollama. No internet unless you choose to search.</p><div class="suggestions"><button data-prompt="Help me plan my week">Plan my week <b>↗</b></button><button data-prompt="Help me think through a decision">Think something through <b>↗</b></button></div></section>
    <section class="conversation" id="conversation" aria-live="polite"></section>
    <form id="chat-form" class="composer"><textarea id="prompt" rows="1" placeholder="Message LocalMate…" aria-label="Message LocalMate"></textarea><div class="compose-bottom"><span>LOCAL MODEL · <span id="model">OLLAMA</span></span><button class="send" aria-label="Send message">↑</button></div></form>
    <div class="tools"><button id="web-toggle" class="tool">◎ <span>Search the web</span></button><span class="hint">Only runs when you tap it</span></div>
    <footer><span>YOUR DATA STAYS YOURS</span><button id="clear">CLEAR CHAT</button></footer>
  </main><script src="/app.js" defer></script>
</body>
</html>
